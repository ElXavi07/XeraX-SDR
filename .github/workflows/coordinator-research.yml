name: Coordinator research checks
on:
  push:
    paths: ['experiments/iq_coordinator/**', 'experiments/iq_slabs/**', '.github/workflows/coordinator-research.yml']
  pull_request:
    paths: ['experiments/iq_coordinator/**', 'experiments/iq_slabs/**', '.github/workflows/coordinator-research.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cmake -S experiments/iq_coordinator -B build/iq-coordinator -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/iq-coordinator --config Release --parallel 2
      - run: ctest --test-dir build/iq-coordinator -C Release --output-on-failure --no-tests=error
      - name: Explore abstract boundary ownership with intentional broken controls
        run: python -m unittest discover -s experiments/iq_coordinator -p test_model_contract.py -v
      - name: Verify abstract checks remain active under Python optimization
        run: python -O -m unittest discover -s experiments/iq_coordinator -p test_model_contract.py -v
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure address and undefined behavior instrumentation
        if: matrix.sanitizer == 'address-undefined'
        run: cmake -S experiments/iq_coordinator -B build/iq-coordinator-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Configure separate data race instrumentation
        if: matrix.sanitizer == 'thread'
        run: cmake -S experiments/iq_coordinator -B build/iq-coordinator-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=thread -O1 -g -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - run: cmake --build build/iq-coordinator-sanitized --parallel 2
      - name: Verify ThreadSanitizer detects the deliberate control race
        if: matrix.sanitizer == 'thread'
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          clang++ -std=c++17 -fsanitize=thread -O1 -g -pthread experiments/iq_coordinator/tsan_probe.cpp -o build/tsan-probe
          python experiments/iq_coordinator/check_tsan_probe.py build/tsan-probe
      - name: Execute independent interleaving contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/iq-coordinator-sanitized --output-on-failure --no-tests=error
