name: NXDN recovery evidence framework
on:
  workflow_dispatch:
  push:
    paths: ['experiments/nxdn_recovery/**', 'experiments/nxdn_engine_gap/analyze.py', 'experiments/nxdn_frames/generate_vectors.py', '.github/workflows/nxdn-recovery-framework.yml']
  pull_request:
    paths: ['experiments/nxdn_recovery/**', 'experiments/nxdn_engine_gap/analyze.py', 'experiments/nxdn_frames/generate_vectors.py', '.github/workflows/nxdn-recovery-framework.yml']
permissions:
  contents: read
jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test evidence checker and retained process failures
        run: python -m unittest discover -s experiments/nxdn_recovery -v
      - name: Verify checks remain active with Python optimization
        run: python -O -m unittest discover -s experiments/nxdn_recovery -v
# This workflow tests the Python evidence framework only. It does not execute
# the receiver matrix or claim Linux native recovery or device acceptance.
