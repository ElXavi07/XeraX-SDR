name: NXDN active boundary evidence framework
on:
  workflow_dispatch:
  push:
    paths: ['experiments/nxdn_active_boundaries_v1/**', '.github/workflows/nxdn-active-boundaries-framework.yml']
  pull_request:
    paths: ['experiments/nxdn_active_boundaries_v1/**', '.github/workflows/nxdn-active-boundaries-framework.yml']
permissions:
  contents: read
jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check active exposure and finite-slot evidence
        run: python -m unittest discover -s experiments/nxdn_active_boundaries_v1 -v
      - name: Check gates with Python optimization
        run: python -O -m unittest discover -s experiments/nxdn_active_boundaries_v1 -v
# These jobs never invoke a native receiver, encoder or historical matrix.
