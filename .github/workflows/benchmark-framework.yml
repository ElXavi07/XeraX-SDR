name: Benchmark framework
on:
  push:
    paths: ['benchmarks/**', 'scripts/check_iq_parity.py', 'checks/dibit_metrics.cpp', 'upstream/dsd-neo/include/dsd-neo/core/dibit_soft_metrics.h', '.github/workflows/benchmark-framework.yml']
  pull_request:
    paths: ['benchmarks/**', 'scripts/check_iq_parity.py', 'checks/dibit_metrics.cpp', 'upstream/dsd-neo/include/dsd-neo/core/dibit_soft_metrics.h', '.github/workflows/benchmark-framework.yml']
permissions:
  contents: read
jobs:
  soft-metric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile frozen-reference comparison
        run: g++ -O3 -std=c++17 -Iupstream/dsd-neo/include checks/dibit_metrics.cpp -o dibit_metrics
      - name: Verify 934957 finite inputs
        run: ./dibit_metrics
  framework:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Framework correctness
        run: python -m unittest discover -s benchmarks/tests -v
      - name: Generate deterministic replay corpus
        run: python benchmarks/bench.py generate --out build/ci-bench-corpus --scenarios clean awgn10 echo
      - name: Verify all capture and metadata hashes
        run: python benchmarks/bench.py validate build/ci-bench-corpus/manifest.json
