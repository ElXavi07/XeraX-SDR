name: NXDN finite observation framework
on:
  workflow_dispatch:
  push:
    paths: ['experiments/nxdn_observation_v2/**', 'experiments/nxdn_frames/generate_vectors.py', '.github/workflows/nxdn-observation-framework.yml']
  pull_request:
    paths: ['experiments/nxdn_observation_v2/**', 'experiments/nxdn_frames/generate_vectors.py', '.github/workflows/nxdn-observation-framework.yml']
permissions:
  contents: read
jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test finite observation contract and failure retention
        run: python -m unittest discover -s experiments/nxdn_observation_v2 -v
      - name: Verify gates remain active with Python optimization
        run: python -O -m unittest discover -s experiments/nxdn_observation_v2 -v
# Python-only counterexample tests. This does not run a native receiver matrix,
# validate physical devices, or establish Linux native decoder performance.
