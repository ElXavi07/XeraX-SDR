name: Receiver research checks
on:
  push:
    paths: ['checks/nxdn_convolution_*.cpp', 'checks/CMakeLists.txt', 'upstream/dsd-neo/src/protocol/nxdn/nxdn_convolution.c', 'upstream/dsd-neo/include/dsd-neo/protocol/nxdn/nxdn_convolution.h', 'experiments/**', '.github/workflows/receiver-research.yml']
  pull_request:
    paths: ['checks/nxdn_convolution_*.cpp', 'checks/CMakeLists.txt', 'upstream/dsd-neo/src/protocol/nxdn/nxdn_convolution.c', 'upstream/dsd-neo/include/dsd-neo/protocol/nxdn/nxdn_convolution.h', 'experiments/**', '.github/workflows/receiver-research.yml']
permissions:
  contents: read
jobs:
  independent-nxdn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure real reference-test targets without application dependencies
        run: cmake -S checks -B build/reference -DXERAX_REFERENCE_CHECKS_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build/reference --parallel 2
      - name: Verify target wiring, weighted distance, erasures and clean punctures
        run: |
          for name in DIBIT_METRICS_EXACT_PARITY NXDN_INDEPENDENT_WEIGHTED_CODEWORD_REFERENCE NXDN_INDEPENDENT_PUNCTURED_BLOCKS; do
            ctest --test-dir build/reference --output-on-failure --no-tests=error -R "^${name}$"
          done
  iq-history:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build standalone history prototype
        run: cmake -S experiments/iq_history -B build/iq-history -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/iq-history --config Release
      - name: Check bytes, gaps, epochs, bounds and concurrency
        run: ctest --test-dir build/iq-history -C Release --output-on-failure
      - name: Check latency-report validation and failure preservation
        run: python -m unittest discover -s experiments/iq_history -p test_run_latency.py -v
      - name: Verify validation remains enabled with Python optimization
        run: python -O -m unittest discover -s experiments/iq_history -p test_run_latency.py -v
      - name: Build immutable slab ownership experiment
        run: cmake -S experiments/iq_slabs -B build/iq-slabs -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/iq-slabs --config Release
      - name: Independently check immutable bytes, lifetime, gaps and budgets
        run: ctest --test-dir build/iq-slabs -C Release --output-on-failure --no-tests=error
  slab-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ownership checks with address and undefined-behavior sanitizers
        run: cmake -S experiments/iq_slabs -B build/iq-slabs-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build/iq-slabs-sanitized --parallel 2
      - name: Check ownership and allocations under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/iq-slabs-sanitized --output-on-failure --no-tests=error
